# =============================================
# DEV Profile — Local Development
# =============================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
#    url: jdbc:postgresql://localhost:5432/nukkadseva
#    username: postgres
#    password: yusuf@123

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# Local file storage (no Azure needed)
storage:
  type: local

# Swagger enabled in dev
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Verbose logging in dev
logging:
  level:
    org.springdoc: DEBUG
    com.nukkadseva: DEBUG
#    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG

# JWT for dev (fallback for local testing; replace with secure key in env)
jwt:
  secret:
    key: ${JWT_SECRET_KEY:ZmFrZV9kZXYtZGV2X3NlY3JldA==}
    expiration: 3600000 # 1 hour

# App settings for dev
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
  cookie:
    secure: false
    same-site: lax

app:
  redis:
    enabled: true