spring:
  application:
    name: nukkadseva-backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Database Configuration

  jpa: {}

  cloud:
    azure:
      storage:
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
        blob:
          container-name: ${AZURE_BLOB_CONTAINER_NAME:nukkadseva-files}

  liquibase:
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.json
    default-schema: public
    drop-first: false
    clear-checksums: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    username: ${MAIL_USERNAME:default}
    password: ${MAIL_PASSWORD:default}

  # Profile must be set explicitly per environment
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration
server:
  port: 8080
  address: 0.0.0.0

# JWT Configuration
jwt:
  secret:
    key: ${JWT_SECRET_KEY}
    expiration: 180000

# Google OAuth
google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}

# App Configuration
app:
  base-url: ${APP_BASE_URL:https://nukkadseva-container-cca4cfc4hvhmf0ek.eastasia-01.azurewebsites.net}
  db:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  storage:
    type: ${storage.type:local}
    azure-connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}

# Rate Limiter Configuration
rate-limit:
  auth:
    capacity: 5
    refill: 5
    duration: 60

  public-api:
    capacity: 30
    refill: 30
    duration: 60

  user:
    capacity: 100
    refill: 100
    duration: 60

  booking:
    capacity: 50
    refill: 50
    duration: 60

  admin-api:
    capacity: 200
    refill: 200
    duration: 60